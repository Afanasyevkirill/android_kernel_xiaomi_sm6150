name: Build Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          path: kernel
          submodules: recursive
          ref: 7a173ea96171e484add3837f3792c4dfd8cb2ace

      - name: Checkout AOSP build system (classic build.sh)
        run: |
          git clone https://android.googlesource.com/kernel/build build
          cd build
          git checkout $(git log --oneline --before=2021-01-01 -1 --format=%H)
          cd ..

      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            prebuilts-master/clang/host/linux-x86/clang-r383902
            prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9
          key: toolchain-r383902-gcc49-v2
      - name: Fetch build-tools
        run: |
          mkdir -p build/build-tools/path
          curl -L "https://android.googlesource.com/platform/prebuilts/build-tools/+archive/refs/heads/main/linux-x86.tar.gz" \
            -o buildtools.tar.gz
          file buildtools.tar.gz
          tar -xzf buildtools.tar.gz -C build/build-tools/path
          rm buildtools.tar.gz
          ls build/build-tools/path/bin | head
      - name: Fetch Clang prebuilt (r383902) via archive
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p prebuilts-master/clang/host/linux-x86/clang-r383902
          curl -L "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r383902b/clang-r383902.tar.gz" \
            -o clang.tar.gz
          file clang.tar.gz
          tar -xzf clang.tar.gz -C prebuilts-master/clang/host/linux-x86/clang-r383902
          rm clang.tar.gz
          ls prebuilts-master/clang/host/linux-x86/clang-r383902/bin | head

      - name: Fetch GCC aarch64 prebuilt (4.9)
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          mkdir -p prebuilts/gcc/linux-x86/aarch64
          git clone --depth=1 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 \
            prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev cpio build-essential rsync

      - name: Build
        run: |
          cd kernel
          export ARCH=arm64
          export PATH="$GITHUB_WORKSPACE/prebuilts-master/clang/host/linux-x86/clang-r383902/bin:$GITHUB_WORKSPACE/build/build-tools/path/linux-x86:$GITHUB_WORKSPACE/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin:$PATH"

          make O=../out ARCH=arm64 CC=clang LD=ld.lld HOSTLD=ld.lld sweet_defconfig

          make O=../out ARCH=arm64 \
            CC=clang HOSTCC=clang \
            LD=ld.lld HOSTLD=ld.lld HOSTLDFLAGS=-fuse-ld=lld \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-androidkernel- \
            -j$(nproc)

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-build
          path: |
            out/android-4.14/dist/Image
            out/android-4.14/dist/Image.gz
            out/android-4.14/dist/vmlinux
            out/android-4.14/dist/System.map
          if-no-files-found: warn
